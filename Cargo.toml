[package]
name = "openidea-apimocktle"
version = "0.3.12"
edition = "2024"
publish = false

# Builds on its own for wasm32-wasip2, outside any Cargo workspace.
[workspace]
# A local clone of the SDK (`refs/`, gitignored) is its own workspace root, so
# keep it out of this one. Harmless while the directory is absent.
exclude = ["refs"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The SDK version pins the plugin API the component is built against; keep the
# tag in step with `engines.openidea` in plugin.toml.
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.50" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
