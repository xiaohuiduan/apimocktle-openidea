[package]
name = "openidea-apimocktle"
version = "0.2.2"
edition = "2024"
publish = false

# Builds on its own for wasm32-wasip2, outside any Cargo workspace.
[workspace]
# The reference checkouts under refs/ are separate projects (the SDK is its
# own workspace root), so keep them out of this one.
exclude = ["refs"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The SDK version pins the plugin API the component is built against; keep the
# tag in step with `engines.openidea` in plugin.toml.
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.44" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
