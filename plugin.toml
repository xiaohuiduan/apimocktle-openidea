id = "apimocktle.openidea"
name = "ApiMocktle"
version = "0.2.3"
description = "扫描 Java/Kotlin 源码里的 HTTP 接口（Spring MVC、JAX-RS、Feign），在底部仪表盘按控制器浏览、搜索、跳到源码声明，接口也会进入 Search Everywhere，并在 .http 文件里补全 URL。导出到 ApiMocktle：选定目标项目，自动创建分类、按 method + path 更新已有接口，请求/响应体按项目里的 DTO 生成 JSON Schema（Result<T> 这类包装保留字段并代入泛型实参，multipart 文件字段一并导出）。ApiMocktle（https://github.com/xiaohuiduan/ApiMocktle）是一个本地运行的 API 管理桌面应用，接口文档、请求调试、自动化测试和局域网分享都在本机完成。"
authors = ["ApiMocktle"]
license = "Apache-2.0"
homepage = "https://github.com/xiaohuiduan/apimocktle-openidea"
change-notes = "0.2.3 — 重写插件概览：说明扫描、浏览与导出流程，并介绍 ApiMocktle 是什么、附仓库地址；README 同步补充该介绍。功能与行为未变。"
categories = ["frameworks", "tools"]
icon = "icons/apimocktle.svg"
engines.openidea = "^1.7"
wasm = "dist/plugin.wasm"
activation = ["on-command:*", "on-view:dashboard", "on-schedule:60"]

[capabilities]
required = ["project.read", "storage", "net:localhost", "net:127.0.0.1"]

[[contributes.commands]]
id = "export-project"
title = "ApiMocktle: 导出项目接口"
category = "ApiMocktle"

[[contributes.commands]]
id = "export-file"
title = "ApiMocktle: 导出当前文件接口"
category = "ApiMocktle"

[[contributes.commands]]
id = "export-continue"
title = "ApiMocktle: 继续同步剩余接口"
category = "ApiMocktle"

[[contributes.commands]]
id = "open-dashboard"
title = "ApiMocktle: 打开 API 仪表盘"
category = "ApiMocktle"

[[contributes.commands]]
id = "refresh"
title = "ApiMocktle: 重新扫描接口"
category = "ApiMocktle"

[[contributes.keymaps]]
command = "export-file"
key = "Alt+Shift+E"
mac = "Alt+Shift+E"

[[contributes.menus]]
menu = "editor.context"
command = "export-file"
when = "editorFocus"

[[contributes.menus]]
menu = "projectView.context"
command = "export-file"

[[contributes.views]]
id = "dashboard"
title = "ApiMocktle"
icon = "icons/apimocktle.svg"
location = "bottom"

[contributes.settings]
title = "ApiMocktle"
schema = "settings.schema.json"

[[contributes.endpoints]]
files = ["**/*.java", "**/*.kt"]
