id = "apimocktle.openidea"
name = "ApiMocktle"
version = "0.2.1"
description = "从 Java/Kotlin 源码（Spring MVC、JAX-RS、Feign）提取 HTTP 接口，浏览它们，并导出到 ApiMocktle / YApi 兼容的服务器。"
authors = ["ApiMocktle"]
license = "Apache-2.0"
homepage = "https://github.com/xiaohuiduan/apimocktle-openidea"
change-notes = "0.2.1 — 修三处缺陷：① 导出队列记住目标服务器与令牌指纹，设置改变后剩余批次暂停并提示两条出路，不再把接口发到另一个服务器；分类 id 缓存按服务器隔离。② multipart / form 参数（@RequestPart、@FormParam、@ModelAttribute）写入 req_body_form、req_body_type 为 form，请求体不再被描述成空 JSON 对象。③ Kotlin 类里的属性初始化器（如 private val client = Client()）不再吞掉其后的方法，此前整个类可能扫描出 0 个接口。"
categories = ["frameworks", "tools"]
icon = "icons/apimocktle.svg"
engines.openidea = "^1.7"
wasm = "dist/plugin.wasm"
activation = ["on-command:*", "on-view:dashboard", "on-schedule:60"]

[capabilities]
required = ["project.read", "storage", "net:localhost", "net:127.0.0.1"]

[[contributes.commands]]
id = "export-project"
title = "ApiMocktle: 导出项目接口"
category = "ApiMocktle"

[[contributes.commands]]
id = "export-file"
title = "ApiMocktle: 导出当前文件接口"
category = "ApiMocktle"

[[contributes.commands]]
id = "export-continue"
title = "ApiMocktle: 继续同步剩余接口"
category = "ApiMocktle"

[[contributes.commands]]
id = "open-dashboard"
title = "ApiMocktle: 打开 API 仪表盘"
category = "ApiMocktle"

[[contributes.commands]]
id = "refresh"
title = "ApiMocktle: 重新扫描接口"
category = "ApiMocktle"

[[contributes.keymaps]]
command = "export-file"
key = "Alt+Shift+E"
mac = "Alt+Shift+E"

[[contributes.menus]]
menu = "editor.context"
command = "export-file"
when = "editorFocus"

[[contributes.menus]]
menu = "projectView.context"
command = "export-file"

[[contributes.views]]
id = "dashboard"
title = "ApiMocktle"
icon = "icons/apimocktle.svg"
location = "bottom"

[contributes.settings]
title = "ApiMocktle"
schema = "settings.schema.json"

[[contributes.endpoints]]
files = ["**/*.java", "**/*.kt"]
