id = "apimocktle.openidea"
name = "ApiMocktle"
version = "0.3.5"
# The overview is the one text the host renders verbatim: `description` is not in
# the host's translatable keys (`pluginText.ts`), and the details page draws it as
# a single `<p>` with no `pre-wrap`, so HTML collapses any newline into a space —
# a line break cannot be produced from the manifest. The two languages are
# therefore separated by a visible marker instead, English first (the marketplace
# list row truncates to one line with an ellipsis).
description = "Extract HTTP endpoints from Java/Kotlin sources (Spring MVC, JAX-RS, Feign) and browse them in a bottom dashboard grouped by controller, with search, go-to-source, Search Everywhere and .http URL completion. Export to ApiMocktle: pick a target project, and it creates categories, matches existing endpoints by method + path, and writes request/response bodies as JSON Schema from the project's DTOs (Result<T> wrappers keep their fields with the type argument substituted; multipart files are exported; DTOs missing from the source are read from Maven dependency jars). ApiMocktle (https://github.com/xiaohuiduan/ApiMocktle) is a local API-management desktop app. ▍中文：扫描 Java/Kotlin 源码里的 HTTP 接口（Spring MVC、JAX-RS、Feign），在底部仪表盘按控制器浏览、搜索、跳到源码声明，接口也会进入 Search Everywhere，并在 .http 文件里补全 URL。导出到 ApiMocktle：选定目标项目，自动创建分类、按 method + path 更新已有接口，请求/响应体按项目里的 DTO 生成 JSON Schema（Result<T> 这类包装保留字段并代入泛型实参，multipart 文件字段一并导出；源码里没有的 DTO 会从 Maven 依赖 jar 的 class 文件里解析）。ApiMocktle 是一个本地运行的 API 管理桌面应用，接口文档、请求调试、自动化测试和局域网分享都在本机完成。"
authors = ["ApiMocktle"]
license = "Apache-2.0"
homepage = "https://github.com/xiaohuiduan/apimocktle-openidea"
change-notes = "0.3.5 — 按每个源文件自己的 import 解析同名 DTO。前两版修好了「同包两个控制器各自声明嵌套 DTO」和「递归解析字段用错作用域」，但导入表仍是全项目一张：com.web.AController import com.alpha.Payload、com.web.BController import com.beta.Payload 时，第二个 import 被丢掉，B 接口拿到 A 的类型，导出会覆盖服务器上正确的文档。现在导入按文件保存，类型解析和后续 Schema 生成都沿用该文件的导入（DtoIndex 记录「接口作用域 + 简单名 → 限定类型」的别名）。验证：四个源文件、两个独立顶层同名 DTO 各走自己的 import；三轮 review 的 6 个回归用例全过，141 个用例全绿，yudao 实测 3603 接口 / 1663 DTO 无回归。"
categories = ["frameworks", "tools"]
icon = "icons/apimocktle.svg"
engines.openidea = "^1.14"
wasm = "dist/plugin.wasm"
activation = ["on-command:*", "on-view:dashboard", "on-schedule:60"]

[capabilities]
required = ["project.read", "storage", "net:localhost", "net:127.0.0.1"]
# 依赖 jar 在项目之外：读取 ~/.m2/repository 需要这条授权。用户不勾选时
# 插件照常工作，只是源码里没有的类型退化成 object。
# `build.read` 读 IDE 已解析的依赖图：有它就不必自己遍历 POM，版本与冲突消解也
# 由 IDE 给。不勾选时退回自己解析 POM，功能不变。
optional = ["fs.read:~/.m2/repository", "build.read"]

# Command, view and settings titles are the source text of `locales/<tag>.json`:
# write them in English and put the translation in that catalog (see
# `locales/zh-CN.json`). `description` and `change-notes` stay Chinese: the
# plugin details page renders them as written and never translates them.

[[contributes.commands]]
id = "export-project"
title = "ApiMocktle: Export Project Endpoints"
category = "ApiMocktle"

[[contributes.commands]]
id = "export-file"
title = "ApiMocktle: Export Endpoints in Current File"
category = "ApiMocktle"

[[contributes.commands]]
id = "export-continue"
title = "ApiMocktle: Continue Syncing Remaining Endpoints"
category = "ApiMocktle"

[[contributes.commands]]
id = "open-dashboard"
title = "ApiMocktle: Open API Dashboard"
category = "ApiMocktle"

[[contributes.commands]]
id = "refresh"
title = "ApiMocktle: Rescan Endpoints"
category = "ApiMocktle"

[[contributes.keymaps]]
command = "export-file"
key = "Alt+Shift+E"
mac = "Alt+Shift+E"

[[contributes.menus]]
menu = "editor.context"
command = "export-file"
when = "editorFocus"

[[contributes.menus]]
menu = "projectView.context"
command = "export-file"

[[contributes.views]]
id = "dashboard"
title = "ApiMocktle"
icon = "icons/apimocktle.svg"
location = "bottom"

# A single page, so the settings tree stays one level (`插件 › ApiMocktle`).
# The folder chooser lives on the dashboard toolbar and in the command palette:
# this form has no `actions`, and `pages` would add a second tree level.
[contributes.settings]
title = "ApiMocktle"
schema = "settings.schema.json"

[[contributes.endpoints]]
files = ["**/*.java", "**/*.kt"]
