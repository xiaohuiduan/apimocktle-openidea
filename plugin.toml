id = "apimocktle.openidea"
name = "ApiMocktle"
version = "0.2.5"
description = "扫描 Java/Kotlin 源码里的 HTTP 接口（Spring MVC、JAX-RS、Feign），在底部仪表盘按控制器浏览、搜索、跳到源码声明，接口也会进入 Search Everywhere，并在 .http 文件里补全 URL。导出到 ApiMocktle：选定目标项目，自动创建分类、按 method + path 更新已有接口，请求/响应体按项目里的 DTO 生成 JSON Schema（Result<T> 这类包装保留字段并代入泛型实参，multipart 文件字段一并导出；源码里没有的 DTO 会从 Maven 依赖 jar 的 class 文件里解析）。ApiMocktle（https://github.com/xiaohuiduan/ApiMocktle）是一个本地运行的 API 管理桌面应用，接口文档、请求调试、自动化测试和局域网分享都在本机完成。"
authors = ["ApiMocktle"]
license = "Apache-2.0"
homepage = "https://github.com/xiaohuiduan/apimocktle-openidea"
change-notes = "0.2.5 — 修两处会丢接口的解析缺陷：① 路由常量按声明它的类解析。此前 `ARoutes.PATH` 与 `BRoutes.PATH` 都命中同一个全局缓存，两个控制器方法落到同一路径后被去重，第二个接口整条丢失；现在限定名只在声明类里查，不带限定名时先看当前类、再看 static 导入，同名歧义时不猜并退回 /。② 实现了接口的类不再丢泛型参数。javac 把接口写在 class Signature 的父类之后，此前解析要求读到末尾，于是整个签名被丢弃，`ApiEnvelope<T> implements Serializable` 的 `T` 无法代入、载荷字段变成空对象。功能与设置未变。"
categories = ["frameworks", "tools"]
icon = "icons/apimocktle.svg"
engines.openidea = "^1.7"
wasm = "dist/plugin.wasm"
activation = ["on-command:*", "on-view:dashboard", "on-schedule:60"]

[capabilities]
required = ["project.read", "storage", "net:localhost", "net:127.0.0.1"]
# 依赖 jar 在项目之外：读取 ~/.m2/repository 需要这条授权。用户不勾选时
# 插件照常工作，只是源码里没有的类型退化成 object。
optional = ["fs.read:~/.m2/repository"]

[[contributes.commands]]
id = "export-project"
title = "ApiMocktle: 导出项目接口"
category = "ApiMocktle"

[[contributes.commands]]
id = "export-file"
title = "ApiMocktle: 导出当前文件接口"
category = "ApiMocktle"

[[contributes.commands]]
id = "export-continue"
title = "ApiMocktle: 继续同步剩余接口"
category = "ApiMocktle"

[[contributes.commands]]
id = "open-dashboard"
title = "ApiMocktle: 打开 API 仪表盘"
category = "ApiMocktle"

[[contributes.commands]]
id = "refresh"
title = "ApiMocktle: 重新扫描接口"
category = "ApiMocktle"

[[contributes.keymaps]]
command = "export-file"
key = "Alt+Shift+E"
mac = "Alt+Shift+E"

[[contributes.menus]]
menu = "editor.context"
command = "export-file"
when = "editorFocus"

[[contributes.menus]]
menu = "projectView.context"
command = "export-file"

[[contributes.views]]
id = "dashboard"
title = "ApiMocktle"
icon = "icons/apimocktle.svg"
location = "bottom"

# A single page, so the settings tree stays one level (`插件 › ApiMocktle`).
# The folder chooser lives on the dashboard toolbar and in the command palette:
# this form has no `actions`, and `pages` would add a second tree level.
[contributes.settings]
title = "ApiMocktle"
schema = "settings.schema.json"

[[contributes.endpoints]]
files = ["**/*.java", "**/*.kt"]
