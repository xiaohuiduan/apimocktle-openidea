<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ApiMocktle</title>
<style>
  :root {
    color-scheme: dark light;
    --bg: #14171c;
    --bg-soft: #1a1e24;
    --bg-row: #1e232a;
    --fg: #d6dae0;
    --fg-dim: #8b949f;
    --line: #272d36;
    --accent: #2b9e93;
    --get: #4aa8d8;
    --post: #d98b4a;
    --put: #6fa8dc;
    --delete: #d96b6b;
    --patch: #b48ead;
    --ok: #6fbf73;
    --warn: #d9b34a;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fbfbfa; --bg-soft: #f3f3f1; --bg-row: #ffffff; --fg: #23262b;
      --fg-dim: #6b7280; --line: #e2e2df; --accent: #1f8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; gap: 7px; align-items: center; flex-wrap: wrap;
    padding: 7px 9px; border-bottom: 1px solid var(--line); background: var(--bg-soft);
  }
  #q {
    flex: 1; min-width: 90px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 9px; font-size: 12px; outline: none;
  }
  #q:focus { border-color: var(--accent); }
  select {
    background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    border-radius: 5px; padding: 5px 6px; font-size: 12px; max-width: 30vw;
  }
  #count { color: var(--fg-dim); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 12px; }
  button {
    background: var(--bg-row); color: var(--fg); border: 1px solid var(--line);
    border-radius: 5px; padding: 5px 10px; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.08); color: #fff; }
  main { flex: 1; display: flex; min-height: 0; }
  #list { flex: 1.05; overflow: auto; margin: 0; padding: 4px 0; list-style: none; border-right: 1px solid var(--line); min-width: 0; }
  #list .group {
    padding: 8px 10px 4px; color: var(--fg-dim); font-size: 11px; letter-spacing: .04em;
    text-transform: uppercase; position: sticky; top: 0; background: var(--bg); z-index: 1;
  }
  .row { display: flex; gap: 8px; align-items: baseline; padding: 5px 10px; cursor: pointer; border-left: 2px solid transparent; }
  .row:hover { background: var(--bg-row); }
  .row.sel { background: var(--bg-row); border-left-color: var(--accent); }
  .verb {
    font: 600 10px/1 var(--mono); letter-spacing: .05em; padding: 3px 5px; border-radius: 3px;
    color: #0d1117; background: var(--fg-dim); flex: none; min-width: 42px; text-align: center;
  }
  .verb.GET { background: var(--get); } .verb.POST { background: var(--post); }
  .verb.PUT { background: var(--put); } .verb.DELETE { background: var(--delete); }
  .verb.PATCH { background: var(--patch); } .verb.ANY { background: var(--fg-dim); }
  .path { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .note { color: var(--fg-dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 38%; }
  #detail { flex: 1; overflow: auto; padding: 12px 14px; min-width: 0; }
  #detail h2 { font-size: 14px; margin: 0 0 2px; font-family: var(--mono); word-break: break-all; }
  #detail .meta { color: var(--fg-dim); font-size: 11px; margin-bottom: 10px; }
  #detail h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-dim); margin: 13px 0 4px; }
  .kv { font-family: var(--mono); font-size: 12px; padding: 2px 0; }
  .kv b { color: var(--fg); font-weight: 500; }
  .kv span { color: var(--fg-dim); }
  .empty { color: var(--fg-dim); text-align: center; margin-top: 40px; font-size: 12px; }
  .actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  footer {
    border-top: 1px solid var(--line); padding: 4px 10px; color: var(--fg-dim);
    font-size: 11px; display: flex; gap: 8px; align-items: center; background: var(--bg-soft);
  }
  #status { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status.ok { color: var(--ok); } #status.warn { color: var(--warn); }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; }
</style>
</head>
<body>
<header>
  <input id="q" type="search" autocomplete="off" spellcheck="false">
  <select id="project"></select>
  <span id="count">—</span>
  <button id="rescan"></button>
  <button id="exportAll" class="primary"></button>
</header>
<main>
  <ul id="list"></ul>
  <section id="detail"></section>
</main>
<footer><span id="status"></span><span class="pill" id="cfg"></span></footer>
<script>
(() => {
  const START = "__START__";
  const api = window.openidea || {};
  const $ = (id) => document.getElementById(id);
  const list = $("list"), detail = $("detail"), status = $("status"), count = $("count"), projectBox = $("project");

  // The start data carries the IDE's UI language: the host translates a
  // package's declarations, but an `html` body it leaves alone, so this page
  // picks its own text. Unknown languages fall back to English, like the host.
  //
  // `render` replaces the quoted placeholder below with a JSON *object
  // literal*, so this reads it as a value — JSON.parse would only see
  // "[object Object]" and throw. Opening the file directly leaves the string in
  // place, which the `typeof` check also covers. (The placeholder name is not
  // repeated literally anywhere else in this file: `render` substitutes the
  // first occurrence, so a second one would silently win.)
  const start = (typeof START === "object" && START) || {};
  /**
   * The page's language: `host::locale()` decides, with a narrow fallback.
   *
   * `start.locale` is the IDE's own answer (the `appearance.locale` setting,
   * reported as a BCP 47 tag) and it is the only thing that may pick the
   * language: a user on an English IDE must get English even when Windows itself
   * is Chinese.
   *
   * The fallback is only for a host that reports nothing at all (`""`), which
   * older builds can do before the language has been pushed. `navigator.language`
   * is the *system* language, so it must never override a non-empty answer.
   */
  const isChinese = (tag) => String(tag || "").toLowerCase().split(/[-_]/)[0] === "zh";
  const navigatorLanguage = (() => {
    try {
      return (typeof navigator !== "undefined" && (navigator.language || navigator.userLanguage)) || "";
    } catch (_) {
      return "";
    }
  })();
  const hostLocale = String(start.locale || "").trim();
  let ZH = isChinese(hostLocale || navigatorLanguage);

  /** English source, then Chinese; `STR.k` is `[en, zh]`. */
  const STR = {
    search: ["Search path / method / controller", "搜索路径 / 方法名 / 控制器"],
    projectTitle: ["Export target project", "导出目标项目"],
    loadingProjects: ["Loading projects…", "加载项目…"],
    loading: ["Loading…", "加载中…"],
    noEndpoints: ["No endpoints match", "没有匹配的接口"],
    selectOne: ["Select an endpoint", "选择一个接口"],
    rescanTitle: ["Drop the cache and parse the sources again", "丢弃缓存并重新解析源码"],
    rescan: ["Rescan", "重新扫描"],
    exportAll: ["Export All", "导出全部"],
    queryParams: ["Query parameters", "查询参数"],
    requestBody: ["Request body", "请求体"],
    source: ["Source", "来源"],
    open: ["Go to source", "跳到源码"],
    exportOne: ["Sync this one", "同步这一个"],
    other: ["Other", "其他"],
    notConnected: ["Not connected", "未连接"],
    chooseProject: ["Choose a project", "选择项目"],
    configured: ["Server configured", "服务器已配置"],
    notConfigured: ["Server not configured", "未配置服务器"],
    scanning: ["Scanning…", "扫描中…"],
    ready: ["Ready", "就绪"],
    rescanning: ["Rescanning…", "重新扫描…"],
    starting: ["Starting sync…", "开始同步…"],
    scanDone: ["Scan complete: ", "扫描完成："],
    endpoints: [" endpoint(s) · ", " 个接口 · "],
    files: [" file(s)", " 个文件"],
    truncated: [" · search limit reached, results may be incomplete", " · 已达搜索上限，结果可能不全"],
    projectList: ["Projects: ", "项目列表："],
    syncOne: ["Syncing ", "同步 "],
  };
  /** `STR.k` is `[en, zh]`; a key that is not in the table cannot crash the page. */
  const T = (key) => {
    const pair = STR[key];
    if (!pair) return key;
    return ZH ? pair[1] : pair[0];
  };

  let items = [];
  let selected = -1;

  // What the footer/status currently says, described rather than stored as a
  // finished string, so a language switch can re-render it in the new language
  // instead of losing it. `kind` is always the last argument of `say`.
  let statusState = { key: "ready", args: [], kind: "" };
  let detailIndex = -1; // the endpoint the detail panel shows, -1 for none
  let configured = null; // null until the plugin reports it
  let projects = []; // the last `projects` message's items
  let projectsError = null;
  let hasProjects = false;

  /** The text of a `statusState`, in the current language. */
  const statusText = (s) => {
    switch (s.key) {
      case "scanDone":
        return T("scanDone") + s.args[0] + T("endpoints") + s.args[1] + T("files") +
          (s.args[2] ? T("truncated") : "");
      case "projectList":
        return T("projectList") + s.args[0];
      case "syncOne":
        return T("syncOne") + s.args[0] + " " + s.args[1] + " …";
      case "raw":
        return s.args[0]; // an error the plugin built (already localized)
      default:
        return T(s.key);
    }
  };

  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  /** Sets the status line from a description, remembering it for a re-render. */
  const say = (key, args, kind) => {
    statusState = { key, args: args || [], kind: kind || "" };
    status.textContent = statusText(statusState);
    status.className = statusState.kind;
  };
  /** Sets the status line to text the plugin already localized. */
  const sayRaw = (text, kind) => {
    statusState = { key: "raw", args: [text], kind: kind || "" };
    status.textContent = text;
    status.className = statusState.kind;
  };
  const send = (payload) => { if (api.postMessage) api.postMessage(JSON.stringify(payload)); };
  const target = () => projectBox.value || undefined;

  // The static text lives in the markup, so set it from the table; a language
  // switch runs this again.
  const applyStatic = () => {
    document.documentElement.lang = ZH ? "zh-CN" : "en";
    $("q").placeholder = T("search");
    projectBox.title = T("projectTitle");
    $("rescan").title = T("rescanTitle");
    $("rescan").textContent = T("rescan");
    $("exportAll").textContent = T("exportAll");
    if (configured !== null) $("cfg").textContent = configured ? T("configured") : T("notConfigured");
  };
  applyStatic();
  projectBox.innerHTML = '<option value="">' + esc(T("loadingProjects")) + '</option>';
  list.innerHTML = '<li class="group">' + esc(T("loading")) + '</li>';
  detail.innerHTML = '<p class="empty">' + esc(T("selectOne")) + '</p>';
  say("ready");

  const renderDetail = (item, index) => {
    detailIndex = item ? index : -1;
    if (!item) { detail.innerHTML = '<p class="empty">' + esc(T("selectOne")) + '</p>'; return; }
    const verb = (item.method || "ANY").toUpperCase();
    const out = [];
    out.push('<h2>' + esc(item.path) + '</h2>');
    out.push('<div class="meta"><span class="pill">' + esc(verb) + '</span> ' + esc(item.summary || "") +
      ' · ' + esc(item.framework || "") + ' · ' + esc(item.handler || "") + '</div>');
    if (item.params && item.params.length) {
      out.push("<h3>" + esc(T("queryParams")) + "</h3>" + item.params.map((p) => '<div class="kv"><b>' + esc(p) + '</b> <span>query</span></div>').join(""));
    }
    if (item.body) out.push('<h3>' + esc(T("requestBody")) + '</h3><div class="kv"><b>' + esc(item.body) + '</b></div>');
    out.push('<h3>' + esc(T("source")) + '</h3><div class="kv"><span>' + esc(item.file) + ":" + esc(item.line) + '</span></div>');
    out.push('<div class="actions">' +
      '<button data-act="open">' + esc(T("open")) + '</button>' +
      '<button class="primary" data-act="export">' + esc(T("exportOne")) + '</button></div>');
    detail.innerHTML = out.join("");
    detail.querySelector('[data-act="open"]').onclick = () => send({ op: "open", index });
    detail.querySelector('[data-act="export"]').onclick = () => {
      say("syncOne", [item.method, item.path]);
      send({ op: "export-one", index, project: target() });
    };
  };

  const renderList = () => {
    const needle = $("q").value.trim().toLowerCase();
    const shown = [];
    items.forEach((item, index) => {
      const hay = (item.path + " " + item.summary + " " + item.handler + " " + item.method).toLowerCase();
      if (!needle || hay.includes(needle)) shown.push([index, item]);
    });
    count.textContent = shown.length + " / " + items.length;
    if (!shown.length) { list.innerHTML = '<li class="group">' + esc(T("noEndpoints")) + '</li>'; return; }

    // One section per controller, wherever its routes sit in the sorted list.
    const order = [];
    const byClass = new Map();
    for (const [index, item] of shown) {
      const name = item["class"] || T("other");
      let bucket = byClass.get(name);
      if (!bucket) { bucket = []; byClass.set(name, bucket); order.push(name); }
      bucket.push([index, item]);
    }
    order.sort((a, b) => a.localeCompare(b));

    const frag = document.createDocumentFragment();
    for (const name of order) {
      const head = document.createElement("li");
      head.className = "group";
      head.textContent = name;
      frag.appendChild(head);
      for (const [index, item] of byClass.get(name)) {
        const row = document.createElement("li");
        row.className = "row" + (index === selected ? " sel" : "");
        const verb = document.createElement("span");
        verb.className = "verb " + (item.method || "ANY").toUpperCase();
        verb.textContent = (item.method || "ANY").toUpperCase();
        const path = document.createElement("span");
        path.className = "path";
        path.textContent = item.path;
        const note = document.createElement("span");
        note.className = "note";
        note.textContent = item.summary || "";
        row.append(verb, path, note);
        row.onclick = () => { selected = index; renderList(); renderDetail(item, index); };
        frag.appendChild(row);
      }
    }
    list.replaceChildren(frag);
  };

  /** The target picker's options, from the last `projects` message. */
  const renderProjects = () => {
    const options = ['<option value="">' + esc(projectsError ? T("notConnected") : T("chooseProject")) + "</option>"];
    for (const p of projects) {
      options.push('<option value="' + esc(p.id) + '">' + esc(p.name) + "</option>");
    }
    projectBox.innerHTML = options.join("");
    projectBox.disabled = !hasProjects;
  };

  const handle = (raw) => {
    let payload = raw;
    if (typeof raw === "string") {
      try { payload = JSON.parse(raw); } catch (_) { return; }
    }
    if (!payload) return;
    // The plugin noticed the IDE's language changed: swap the text in place so
    // the list, the selection and the status line survive the switch.
    if (payload.op === "locale") { relocalize(payload.locale); return; }
    if (payload.op === "toast") { sayRaw(payload.text || "", payload.ok === false ? "warn" : "ok"); return; }
    if (payload.op === "projects") {
      projects = payload.items || [];
      projectsError = payload.error || null;
      hasProjects = projects.length > 0;
      renderProjects();
      if (payload.error) say("projectList", [payload.error], "warn");
      return;
    }
    if (payload.op !== "items") return;
    if (payload.error) { sayRaw(payload.error, "warn"); items = []; renderList(); return; }
    items = payload.items || [];
    count.textContent = items.length;
    configured = !!payload.configured;
    $("cfg").textContent = configured ? T("configured") : T("notConfigured");
    say("scanDone", [items.length, payload.files || 0, !!payload.truncated], payload.truncated ? "warn" : "ok");
    renderList();
    selected = -1;
    renderDetail(null, -1);
  };

  /**
   * The UI language changed while the page is open: re-render every label in
   * place, keeping the list, the selection and the status line's meaning. The
   * host does not re-render an `html` body, so without this the page would stay
   * in the old language until it is reopened.
   *
   * `hostLocale` is the IDE's own setting and decides on its own; the frame's
   * system language is only consulted when it is empty.
   */
  const relocalize = (hostLocale) => {
    const next = isChinese(String(hostLocale || "").trim() || navigatorLanguage);
    if (next === ZH) return;
    ZH = next;
    applyStatic();
    renderProjects();
    renderList();
    // Rebuild the detail panel from the endpoint it was showing, not from the
    // rendered markup, so the labels change and the selection survives.
    renderDetail(detailIndex >= 0 ? items[detailIndex] : null, detailIndex);
    status.textContent = statusText(statusState);
    status.className = statusState.kind;
  };

  if (api.onMessage) api.onMessage(handle);
  $("q").addEventListener("input", renderList);
  $("rescan").onclick = () => { say("rescanning"); send({ op: "refresh" }); };
  $("exportAll").onclick = () => { say("starting"); send({ op: "export-all", project: target() }); };

  if (start.configured !== undefined) {
    configured = !!start.configured;
    $("cfg").textContent = configured ? T("configured") : T("notConfigured");
  }

  say("scanning");
  // Ask the plugin for the language instead of trusting only the one baked into
  // the page at render time. The host renders a view *before* it may have pushed
  // the current language to the plugin, so the start value can be stale — that is
  // why the dashboard used to need a reload to switch. Asking on load, and then
  // once in a while, makes the page follow the IDE by itself.
  const askLocale = () => send({ op: "locale" });
  askLocale();
  if (typeof setInterval === "function") setInterval(askLocale, 5000);
  send({ op: "scan" });
  send({ op: "projects" });
})();
</script>
</body>
</html>
